<script>
  window.addEventListener('DOMContentLoaded', function() {
    
    // ------------------------------------
    // МАСКИ ТА ВАЛІДАЦІЯ ТЕЛЕФОНІВ (ДЛЯ ВСІХ ФОРМ)
    // ------------------------------------
    var quickPhoneInputs = document.querySelectorAll('.quick-phone-input');
    quickPhoneInputs.forEach(function(inputEl) {
      var errorEl = inputEl.nextElementSibling;
      inputEl.addEventListener('focus', function() {
        if (!inputEl.value.startsWith('+380')) inputEl.value = '+380 ';
      });
      inputEl.addEventListener('input', function() {
        if (!inputEl.value.startsWith('+380')) inputEl.value = '+380 ';
        var digits = inputEl.value.replace(/[^\d+]/g, '');
        inputEl.value = digits;
        if (errorEl && errorEl.classList.contains('quick-phone-error')) {
          errorEl.textContent = '';
        }
      });
    });

    var quizPhoneInput = document.getElementById('phone-input');
    var quizPhoneError = document.getElementById('phone-error');
    if (quizPhoneInput) {
      quizPhoneInput.addEventListener('focus', function() {
        if (!quizPhoneInput.value.startsWith('+380')) quizPhoneInput.value = '+380 ';
      });
      quizPhoneInput.addEventListener('input', function() {
        if (!quizPhoneInput.value.startsWith('+380')) quizPhoneInput.value = '+380 ';
        var digits = quizPhoneInput.value.replace(/[^\d+]/g, '');
        quizPhoneInput.value = digits;
        if (quizPhoneError) quizPhoneError.textContent = '';
      });
    }

    // Збір UTM
    var params = new URLSearchParams(window.location.search);
    var utm = {
      utm_source: params.get('utm_source') || '',
      utm_medium: params.get('utm_medium') || '',
      utm_campaign: params.get('utm_campaign') || '',
      utm_term: params.get('utm_term') || '',
      utm_content: params.get('utm_content') || ''
    };

    // ------------------------------------
    // ВІДПРАВКА: ВБУДОВАНІ КОРОТКІ ФОРМИ
    // ------------------------------------
    var quickForms = document.querySelectorAll('.inline-quick-form');
    quickForms.forEach(function(form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var phoneInput = form.querySelector('.quick-phone-input');
        var errorEl = form.querySelector('.quick-phone-error');
        var phoneDigits = phoneInput ? phoneInput.value.replace(/\D/g, '') : '';
        
        if (phoneDigits.length < 12) {
          if (errorEl) errorEl.textContent = 'Введіть код + 9 цифр';
          if (phoneInput) phoneInput.focus();
          return false;
        }

        var nameInput = form.querySelector('input[name="quick_name"]');
        var sourceName = form.closest('.hero-grid') ? 'Форма на головному екрані' : 'Форма в секції Ситуації';
        
        var payload = {
          name: nameInput && nameInput.value.trim() !== '' ? nameInput.value : 'Не вказано',
          phone: phoneInput.value,
          role: 'Швидка заявка',
          question1: sourceName,
          utm: utm
        };

        fetch('/.netlify/functions/send-telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(function(res) {
          if (res.ok) {
            // Трекінг Ліда у Facebook Pixel / Meta Ads
            if (typeof fbq === 'function') {
              fbq('track', 'Lead');
            }

            form.style.display = 'none';
            var container = form.closest('.inline-quick-form-container');
            var successMsg = container.querySelector('.inline-quick-form-success');
            if (successMsg) successMsg.style.display = 'block';
          } else {
            alert('Помилка відправки. Спробуйте ще раз.');
          }
        })
        .catch(function(err) { console.error(err); });
      });
    });

    // ------------------------------------
    // ВІДПРАВКА: ДЕТАЛЬНА КВІЗ-ФОРМА
    // ------------------------------------
    var quizForm = document.getElementById('intro-form');
    if (quizForm) {
      quizForm.addEventListener('submit', function(e) {
        var phoneDigits = quizPhoneInput ? quizPhoneInput.value.replace(/\D/g, '') : '';
        
        if (phoneDigits.length < 12) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          if (quizPhoneError) {
            quizPhoneError.textContent = 'Введіть код + 9 цифр';
            quizPhoneError.style.color = '#e53935';
          }
          quizPhoneInput.focus();
          return false;
        }

        e.preventDefault();

        var nameInput = quizForm.querySelector('input[name="name"]');
        var roleInput = quizForm.querySelector('select[name="role"]');
        var q1Checked = quizForm.querySelector('input[name="decision"]:checked');

        var payload = {
          name: nameInput ? nameInput.value : '',
          phone: quizPhoneInput ? quizPhoneInput.value : '',
          role: roleInput ? roleInput.value : '',
          question1: q1Checked ? q1Checked.value : 'Не обрано',
          utm: utm
        };

        fetch('/.netlify/functions/send-telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(function(res) {
          if (res.ok) {
            // Трекінг Ліда у Facebook Pixel / Meta Ads
            if (typeof fbq === 'function') {
              fbq('track', 'Lead');
            }

            var successState = document.getElementById('success-state');
            if (quizForm) quizForm.style.display = 'none';
            if (successState) successState.hidden = false;
          } else {
            alert('Помилка відправки заявки. Спробуйте ще раз.');
          }
        })
        .catch(function(err) { console.error(err); });
      }, true);
    }
  });
</script>
